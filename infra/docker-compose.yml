# Lokaler Entwicklungs-Stack.
#
# Was hier bewusst NICHT läuft:
#   - Neuindizierung und Ingestion. Docker Desktop auf macOS erreicht die Apple-GPU nicht
#     (Linux-VM ohne Metal), und der VM stehen hier nur rund 7,7 GiB zur Verfügung.
#     Indexaufbau läuft nativ auf dem Mac oder auf Modal. Siehe Semantica 8d0d91c0.
#   - Supabase. Das bringt eine eigene CLI mit eigenen Containern mit (`supabase start`).
#
# Health-Checks stehen absichtlich nicht im Container: das Qdrant-Image enthält weder
# curl noch wget. `infra/stack.sh status` prüft die Bereitschaft vom Host aus.

name: recht-und-papier

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rup-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__LOG_LEVEL: ${QDRANT_LOG_LEVEL:-INFO}
    deploy:
      resources:
        limits:
          memory: 2g

  # legal-engine: wird ergänzt, sobald der Reranker lokal vollständig vorliegt und gemessen ist.
  #
  # Die hostbare FastAPI-Schicht liegt im Jura-Branch `qdrant-server-mode`. Noch offen sind
  # Container-Build, Modellbereitstellung und die CPU-Messung mit aktivem Cross-Encoder.

volumes:
  qdrant-storage:

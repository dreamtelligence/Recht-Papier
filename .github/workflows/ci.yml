name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  mobile-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:analysis-status
  edge-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: '2.9.8'
      - run: deno check --config supabase/functions/deno.json supabase/functions/fall-einordnen/index.ts supabase/functions/case-analysis-worker/index.ts
      - run: deno test --config supabase/functions/deno.json supabase/tests/case_analysis_test.ts
